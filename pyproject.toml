[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oggm"
dynamic = ["version"]
authors = [
{ name = "OGGM Contributors", email = "info@oggm.org"}
]
description = "Open Global Glacier Model"
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "configobj",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pandas",
    "requests",
    "scipy",
    "shapely",
    "xarray",
    "pyarrow",
]

[project.optional-dependencies]
build = [
    "build>=1.4.0",
    "twine>=6.2.0",
]
dev = [
    "oggm[docs, full]",
    ]
full = [
    "oggm[build, tests]",
    "bottleneck",
    "cartopy",
    "dask",
    "geopandas",
    "ipython",
    "joblib",
    "motionless",
    "netcdf4",
    "pillow",
    "progressbar2",
    "pyproj",
    "rasterio",
    "rioxarray",
    "salem",
    "scikit-image",
    "scikit-learn",
    "seaborn",
]
docs = [
    "numpydoc",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-book-theme",
    "sphinx-intl",
    "sphinx-reredirects",
    "sphinx-togglebutton",
    "sphinx-design",
]
tests = [
    "pytest",
    "pytest-mpl-oggm>=0.180.1",
]

[project.urls]
"Homepage" = "https://oggm.org"
"Bug Tracker" = "https://github.com/OGGM/oggm/issues"
"Documentation" = "https://docs.oggm.org/"

[project.scripts]
oggm_prepro = "oggm.cli.prepro_levels:main"
oggm_prepro_chunks = "oggm.cli.prepro_chunks:main"
oggm_temp_bias = "oggm.cli.temp_bias:main"
oggm_prepro_diag = "oggm.cli.prepro_diag:main"
oggm_benchmark = "oggm.cli.benchmark:main"
oggm_netrc_credentials = "oggm.cli.netrc_credentials:cli"
"pytest.oggm" = "oggm.tests.__main__:main"

[tool.hatch.build.targets.sdist]
packages = ["oggm"]
exclude = [
    "docs",
    ".coverage.*"
]
include = [
    "pytest.ini",
    "oggm/params.cfg",
    "oggm/data/dem_sources.txt",
    "oggm/data/rgi_chunks.csv",
]
# fallback if include group doesn't work as intended
force-include = {"pytest.ini" = "pytest.ini"}

[tool.hatch.build.targets.wheel]
packages = ["oggm"]
include = [
    "pytest.ini",
    "oggm/params.cfg",
    "oggm/data/dem_sources.txt",
    "oggm/data/rgi_chunks.csv",
]
# fallback if include group doesn't work as intended
force-include = {"pytest.ini" = "pytest.ini"}

[tool.hatch.envs.default]
env-vars-file = ".env"

[tool.hatch.version]
path = "oggm/__init__.py"
source = "vcs"

# This section is for uv, but may also used by hatchling when building the package

# local dependency groups for uv
[dependency-groups]
build = [
    "build>=1.4.0",
    "twine>=6.2.0",
]

[tool.uv.build-backend]
module-root = ""
module-name = "oggm"

# lint/format, atm we use pandas as a reference and tweak as needed

[tool.ruff]
line-length = 88  # TODO: this needs discussing
target-version = "py312"
fix = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
unfixable = []
typing-modules = ["pandas._typing"]

select = [
  # pyflakes
  "F",
  # pycodestyle
  "E", "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # flake8-debugger
  "T10",
  # flake8-gettext
  "INT",
  # pylint
  "PL",
  # flake8-pytest-style
  "PT",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # flake8-type-checking
  "TC",
  # comprehensions
  "C4",
  # pygrep-hooks
  "PGH",
  # Ruff-specific rules
  "RUF",
  # flake8-bandit: exec-builtin
  "S102",
  # numpy-legacy-random
  "NPY002",
  # Perflint
  "PERF",
  # flynt
  "FLY",
  # flake8-logging-format
  "G",
  # flake8-future-annotations
  "FA",
  # unconventional-import-alias
  "ICN001",
  # flake8-slots
  "SLOT",
  # flake8-raise
  "RSE",
  # pyupgrade
  "UP",
]

ignore = [
  ### Intentionally disabled
  # module level import not at top of file
  "E402",
  # do not assign a lambda expression, use a def
  "E731",
  # controversial
  "B007",
  # controversial
  "B008",
  # getattr is used to side-step mypy
  "B010",
  # tests use comparisons but not their returned value
  "B015",
  # Function definition does not bind loop variable
  "B023",
  # Too many arguments to function call
  "PLR0913",
  # Too many returns
  "PLR0911",
  # Too many branches
  "PLR0912",
  # Too many statements
  "PLR0915",
  # Redefined loop name
  "PLW2901",
  # Global statements are discouraged
  "PLW0603",
  # Use `typing.NamedTuple` instead of `collections.namedtuple`
  "PYI024",
  # Use of possibly insecure function; consider using ast.literal_eval
  "S307",
  # while int | float can be shortened to float, the former is more explicit
  "PYI041",
  # incorrect-dict-iterator, flags valid Series.items usage
  "PERF102",
  # pytest-parametrize-names-wrong-type
  "PT006",
  # pytest-parametrize-values-wrong-type
  "PT007",
  # pytest-patch-with-lambda
  "PT008",
  # pytest-raises-with-multiple-statements
  "PT012",
  # pytest-assert-in-except
  "PT017",
  # pytest-composite-assertion
  "PT018",
  # pytest-fixture-param-without-value
  "PT019",
  # The following rules may cause conflicts when used with the formatter:
  "ISC001",
  # if-stmt-min-max
  "PLR1730",
  # nan-comparison
  "PLW0177",

  ### TODO: Enable gradually
  # string quotes
  "Q000",  # this is all over the codebase, so should be done ad hoc
  # Useless statement
  "B018",
  # Magic number
  "PLR2004",
  # comparison-with-itself
  "PLR0124",
  # mutable-class-default
  "RUF012",
  # type-comparison
  "E721",
  # self-or-cls-assignment
  "PLW0642",
  # literal-membership
  "PLR6201", # 847 errors
  # Method could be a function, class method, or static method
  "PLR6301", # 11411 errors
  # Private name import
  "PLC2701", # 27 errors
  # Too many positional arguments (6/5)
  "PLR0917", # 470 errors
  # compare-to-empty-string
  "PLC1901",
  # `tempfile.NamedTemporaryFile` in text mode without explicit `encoding` argument
  "PLW1514", # 1 error
  # Object does not implement `__hash__` method
  "PLW1641", # 16 errors
  # Bad or misspelled dunder method name
  "PLW3201", # 69 errors, seems to be all false positive
  # Unpacking a dictionary in iteration without calling `.items()`
  "PLE1141", # autofixable
  # import-outside-toplevel
  "PLC0415",
  # unnecessary-dunder-call
  "PLC2801",
  # comparison-with-itself
  "PLR0124",
  # too-many-public-methods
  "PLR0904",
  # too-many-return-statements
  "PLR0911",
  # too-many-branches
  "PLR0912",
  # too-many-arguments
  "PLR0913",
  # too-many-locals
  "PLR0914",
  # too-many-statements
  "PLR0915",
  # too-many-boolean-expressions
  "PLR0916",
  # too-many-nested-blocks
  "PLR1702",
  # redefined-argument-from-local
  "PLR1704",
  # unnecessary-lambda
  "PLW0108",
  # global-statement
  "PLW0603",
  # unused-unpacked-variable
  "RUF059",
  # pytest-raises-ambiguous-pattern
  "RUF043",
  # implicit-string-concatenation-in-collection-litera
  "ISC004",
]

exclude = [
  "doc/sphinxext/*.py",
  "doc/build/*.py",
  "doc/temp/*.py",
  ".eggs/*.py",
  # vendored files
  "pandas/util/version/*",
  "pandas/io/clipboard/__init__.py",
  # exclude asv benchmark environments from linting
  "env",
]